[project]
name = "pulse-ingest"
version = "0.1.0"
description = "Ingestion API and storage layer for the Pulse platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulse_ingest*"]

[tool.pytest.ini_options]
markers = ["integration: needs a running Postgres (scripts/dev-db.sh up)"]
