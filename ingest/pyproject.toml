[project]
name = "pulse-ingest"
version = "0.1.0"
description = "Ingestion API and storage layer for the Pulse platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulse_ingest*"]
