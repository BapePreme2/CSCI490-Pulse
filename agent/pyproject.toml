[project]
name = "pulse-agent"
version = "0.1.0"
description = "Lightweight host monitoring agent for the Pulse platform"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pulse-agent = "pulse_agent.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulse_agent*"]
