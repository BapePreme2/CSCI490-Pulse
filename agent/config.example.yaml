# Copy to config.yaml and fill in real values. config.yaml is gitignored
# since it will hold a real API key.

# Full URL of the ingestion API's POST /metrics endpoint.
endpoint: "https://pulse-ingest.example.com/metrics"

# Must match one of the keys in the API's PULSE_API_KEYS.
api_key: "changeme"

# Seconds between collection cycles.
interval_seconds: 10

# Defaults to the machine's hostname if omitted.
hostname: null

# Optional environment label (e.g. dev/staging/prod), reported as a tag on
# every metric this agent sends. Omit it if you don't need one.
environment: dev

# Arbitrary other labels attached to every metric. Cannot include "host" or
# "environment" -- those are set automatically from the fields above.
tags: {}

# How many batches worth of metrics to retain in memory while retrying a
# failed send, before the oldest metrics start getting dropped.
buffer_max_batches: 100

# Seconds to wait for the ingestion API before treating a send as failed.
request_timeout_seconds: 10
